
<div class="modal-header justify-content-between align-items-center">
  <h4 class="font-16 fw-600" ngbAutoFocus>{{data?.headingText || 'Confirm'}}</h4>
  <i class="fas fa-times cursor-pointer font-20 cbs-clr" (click)="_activeModel.close()"></i>
</div>
<div class="modal-body">
  <ng-container *ngIf="!data?.body;else elseBlock">
    <h6 class="font-14 text-color-700 cbs-clr">Are you sure?</h6>
  </ng-container>
  <ng-template #elseBlock>
    <p class="font-14 text-color-700 cbs-clr">{{data?.body}}</p>
  </ng-template>
</div>
<div class="modal-footer border-0 gap-2 justify-content-end">
  <button type="button" class="btn btn-outline-dark" (click)="confirm(false)">{{data?.cancelText || 'Cancel'}}</button>
  <button type="button" class="btn btn-primary" (click)="confirm(true)"><i *ngIf="!data?.hideIcon" class="fas fa-trash-can me-1"></i> {{data?.confirmText || 'Yes'}}</button>
</div>
