<div class="modal-header justify-content-between align-items-center">
  <h6 class="font-20 fw-600">{{data?.heading && data?.heading || 'Video'}}</h6>
  <i class="fas fa-times cursor-pointer font-20 cbs-clr" (click)="_activeModal.close()"></i>
</div>
<div class="modal-body p-2">
  <ng-container *ngIf="data?.source">
    <div class="ratio ratio-16x9">
      <ng-container *ngIf="isIframe; else videoPlayer">
        <iframe [src]="sanitizedUrl"
                frameborder="0"
                allowfullscreen></iframe>
      </ng-container>

      <ng-template #videoPlayer>
        <video controls [src]="sanitizedUrl"></video>
      </ng-template>
    </div>
  </ng-container>
</div>
<div class="modal-footer">
  <button ngbAutoFocus type="button" class="btn btn-outline-dark" (click)="_activeModal.close('Close click')">Close</button>
</div>
