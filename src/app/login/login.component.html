<div class="row login-wrapper gx-0">
  <div class="d-none d-sm-block col-sm-5 col-md-6">
    <div class="left-side">
      <div class="row justify-content-center">
        <div class="col-12">
          <img class="w-100" src="/assets/logo.svg" alt="banner" />
        </div>
      </div>
    </div>
  </div>
  <div class="col-sm-7 col-md-6 bg-white">
    <ng-container *ngIf="loginPage;else elseBlock">
      <div class="row gx-0 align-items-center justify-content-center h-100">
        <div class="col-11 col-sm-11 col-lg-10 col-xl-7">
          <div class="right-side">
            <div class="d-flex align-items-center flex-column my-4">
              <h1>Welcome back</h1>
              <p class="fw-400 cbs-clr mt-2">
                Please enter your details to sign in
              </p>
            </div>
            <form [formGroup]="formGroup" (submit)="login()">
              <div class="mb-3">
                <label class="input-label">Email</label>
                <div class="input-group">
                  <input type="text" class="form-control" placeholder="Enter your email" formControlName="email" />
                </div>
                <validation-error [control]="formGroup.get('email')" [errorMessages]="{required:'Input is required'}"></validation-error>
              </div>
              <div class="mb-3">
                <label class="input-label">Password</label>
                <div class="input-group">
                  <input [type]="isPasswordVisible ? 'text' : 'password'"
                         class="form-control password" placeholder="Enter your password" formControlName="password" />
                </div>
                <validation-error [control]="formGroup.get('password')" [errorMessages]="{required:'Input is required'}"></validation-error>
              </div>
              <div class="d-flex align-items-center justify-content-between">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="" id="remember" />
                  <label class="form-check-label" for="remember">
                    Remember Me
                  </label>
                </div>
                <a href="" class="primary-clr font-14 fw-500">Forgot Password?</a>
              </div>
              <button type="submit" class="btn btn-primary w-100 mt-4"> Sign In</button>
            </form>
          </div>
          <div class="d-flex gap-2 mt-3 justify-content-center">
            <p class="fw-500 cursor-pointer" (click)="handlePrivacyClick('privacy')">Privacy Policy</p>
            <p class="fw-500">-</p>
            <p class="fw-500 cursor-pointer" (click)="handlePrivacyClick('terms')">Terms & Conditions</p>
          </div>
        </div>
      </div>
    </ng-container>
    <ng-template #elseBlock>
      <div class="row gx-0 justify-content-center">
        <div class="col-11">
          <app-privacy-policy [from]="'login'" *ngIf="isPrivacy"></app-privacy-policy>
          <app-terms-conditions [from]="'login'" *ngIf="!isPrivacy"></app-terms-conditions>
        </div>
      </div>
      <div class="col-11">
        <div class="d-flex gap-2 mt-3 justify-content-center">
          <p class="fw-500 cursor-pointer" (click)="handlePrivacyClick('privacy')">Privacy Policy</p>
          <p class="fw-500">-</p>
          <p class="fw-500 cursor-pointer" (click)="handlePrivacyClick('terms')">Terms & Conditions</p>
          <p class="fw-500">-</p>
          <p class="fw-500 cursor-pointer" (click)="handlePrivacyClick('login')">Back To Login</p>
        </div>
      </div>
    </ng-template>
  </div>
</div>
