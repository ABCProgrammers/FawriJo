<app-card>
  <h6 class="mb-4 text-color text-uppercase fw-600 font-14">registered drivers</h6>
  <label class="input-label mb-1 fw-600">Filter By Year</label>
  <div class="row">
    <div class="col-12">
      <ng-select [items]="yearsList"
                 [formControl]="year"
                 [clearable]="false"
                 placeholder="Year"
                 bindLabel="text"
                 bindValue="value"
                 class="ng-select-filter">
      </ng-select>
    </div>
  </div>
  <div class="mt-4" style="height:400px;width:100%">
    <ngx-charts-area-chart [scheme]="colorScheme"
                           [results]="lineChartData"
                           [xAxis]="true"
                           [yAxis]="true"
                           [gradient]="true"
                           [legend]="false"
                           [showXAxisLabel]="false"
                           [showYAxisLabel]="false"
                           [yAxisTickFormatting]="yAxisTicks"
                           [curve]="curve"
                           [autoScale]="true">
    </ngx-charts-area-chart>
  </div>
</app-card>
