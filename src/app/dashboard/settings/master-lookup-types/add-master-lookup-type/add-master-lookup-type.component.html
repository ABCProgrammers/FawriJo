
<div class="modal-header justify-content-between align-items-center">
  <h6 class="font-20 fw-500">{{(data?.edit && 'Edit Master Lookup Type' || 'Add Master Lookup Type')}}</h6>
  <i class="fas fa-times cursor-pointer font-20 cbs-clr" (click)="_activeModal.close()"></i>
</div>
<div class="modal-body" ngbAutoFocus>
  <form [formGroup]="formGroup">
    <div class="row">
      <div class="col-12 d-flex align-items-center justify-content-end mt-3">
        <div class="form-check form-switch">
          <label class="form-check-label" for="isActive">Active</label>
          <input class="form-check-input" type="checkbox" formControlName="status" id="isActive" />
        </div>
      </div>
      <div class="col-6">
        <label class="input-label asterik">Lookup Type Name</label>
        <input type="text" ngbAutoFocus
               formControlName="lookupTypeName"
               class="form-control input-control"
               placeholder="Lookup Type Name" />
        <validation-error [control]="formGroup.get('lookupTypeName')" [errorMessages]="{required:'Input is required'}"></validation-error>
      </div>
      <div class="col-6">
        <label class="input-label">Comments</label>
        <input formControlName="comment" type="text" class="form-control input-control" placeholder="Comments" />
      </div>
    </div>
  </form>
</div>
<div class="modal-footer border-top-0">
  <div class="d-flex justify-content-end gap-2">
    <button type="button" class="btn btn-outline-dark" (click)="_activeModal.close()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="saveData()">{{data?.edit && 'Edit Master Lookup Type' || 'Add Master Lookup Type'}}</button>
  </div>
</div>
