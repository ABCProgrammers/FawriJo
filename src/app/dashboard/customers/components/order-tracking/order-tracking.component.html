<div class="modal-header justify-content-between align-items-center">
  <h6 ngbAutoFocus class="font-20 fw-600">Order Tracking</h6>
</div>
<div class="modal-body">
  <div class="tracking-wrapper mb-3">
    <div class="order-status" *ngFor="let item of orderTracking">
      <div class="icon">
        <i class="fas fa-check"></i>
      </div>
      <div class="d-flex flex-column gap-2 status-text">
        <div class="d-flex align-items-center gap-2">
          <p>{{item?.orderNewStatus?.lookupNameEN?.lookupName}}</p>
          <div class="line"></div>
        </div>
        <div class="d-flex flex-column">
          <span class="font-13 text-color">{{item?.orderNewStatusDate | date:'mediumDate'}} {{item?.time | date:'shortTime'}}</span>
          <span class="font-13 text-color">{{item?.enterUser[0]?.fullName}}</span>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal-footer border-top-0">
  <div class="d-flex justify-content-end gap-2">
    <button type="button" class="btn btn-outline-dark" (click)="_activeModal.close()">Cancel</button>
  </div>
</div>
