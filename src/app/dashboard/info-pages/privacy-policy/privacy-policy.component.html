<div class="row login-wrapper gx-0">
  <div class="d-none d-sm-block col-sm-5 col-md-6">
    <div class="left-side">
      <div class="row justify-content-center">
        <div class="col-12">
          <img class="w-100" src="/assets/logo.svg" alt="banner" />
          <div class="d-flex justify-content-center">
            <button [routerLink]="'/login'" type="button" class="btn btn-primary">Back to Login</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-sm-7 col-md-6 bg-white">
    <div class="row gx-0 justify-content-center">
      <div class="col-11">
        <app-privacy-policy [from]="'login'"></app-privacy-policy>
      </div>
    </div>
  </div>
</div>
